<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${title} + ' · College Assistant'">College Assistant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav th:fragment="navbar(active)" class="navbar navbar-expand-md bg-white border-bottom sticky-top app-navbar">
    <div class="container-fluid px-3 px-md-4">
        <a class="navbar-brand fw-semibold d-flex align-items-center gap-2" th:href="@{/}">
            <span class="brand-mark" aria-hidden="true">CA</span> College Assistant
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-md-0">
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'chat'} ? 'active'"
                                        th:href="@{/chat}">Chat</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link"
                                                                          th:classappend="${active == 'dashboard'} ? 'active'"
                                                                          th:href="@{/admin}">Dashboard</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link"
                                                                          th:classappend="${active == 'documents'} ? 'active'"
                                                                          th:href="@{/admin/documents}">Documents</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link"
                                                                          th:classappend="${active == 'users'} ? 'active'"
                                                                          th:href="@{/admin/users}">Users</a></li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <span class="small text-secondary"><span sec:authentication="principal.name">Name</span>
                    <span class="badge text-bg-light border ms-1" sec:authentication="principal.role">ROLE</span></span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">Log out</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="scripts">
    <div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</div>

</body>
</html>
