<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/layout :: navbar('dashboard')}"></nav>

<main class="container-xl py-4">
    <h1 class="h4 mb-4">Dashboard</h1>

    <div id="statCards" class="row g-3 mb-4"></div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white fw-semibold">Recent uploads</div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead><tr><th>Title</th><th>Status</th><th>Uploaded</th></tr></thead>
                        <tbody id="recentBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white fw-semibold">Unanswered questions</div>
                <ul id="unansweredList" class="list-group list-group-flush"></ul>
            </div>
        </div>
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-semibold">Recent feedback</div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead><tr><th>Rating</th><th>Comment</th><th>Answer that was rated</th><th>From</th><th>When</th></tr></thead>
                        <tbody id="feedbackBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/js/admin-dashboard.js}"></script>
</body>
</html>
