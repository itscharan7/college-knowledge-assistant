<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Users')}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/layout :: navbar('users')}"></nav>

<main class="container-xl py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h4 mb-0">Users</h1>
        <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#createModal">
            Create account
        </button>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-md-6">
            <label for="userSearch" class="visually-hidden">Search users</label>
            <input id="userSearch" class="form-control" placeholder="Search by name or email">
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th>
                    <th class="text-end">Actions</th></tr></thead>
                <tbody id="userBody"></tbody>
            </table>
        </div>
        <div id="userEmpty" class="text-center text-secondary py-5 d-none">No users match your search.</div>
    </div>
</main>

<div class="modal fade" id="createModal" tabindex="-1" aria-labelledby="createTitle" aria-hidden="true">
    <div class="modal-dialog">
        <form id="createForm" class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title h5" id="createTitle">Create account</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="cuName" class="form-label">Full name</label>
                    <input id="cuName" class="form-control" maxlength="120" required>
                </div>
                <div class="mb-3">
                    <label for="cuEmail" class="form-label">Email</label>
                    <input id="cuEmail" type="email" class="form-control" maxlength="255" required>
                </div>
                <div class="mb-3">
                    <label for="cuPassword" class="form-label">Temporary password</label>
                    <input id="cuPassword" type="password" class="form-control" minlength="8" maxlength="72" required
                           autocomplete="new-password">
                    <div class="form-text">At least 8 characters, with a letter and a digit.</div>
                </div>
                <div class="mb-1">
                    <label for="cuRole" class="form-label">Role</label>
                    <select id="cuRole" class="form-select">
                        <option value="FACULTY" selected>FACULTY</option>
                        <option value="STUDENT">STUDENT</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Create</button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/js/admin-users.js}"></script>
</body>
</html>
