<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body class="auth-body">
<main class="auth-card card shadow-sm border-0">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <span class="brand-mark brand-mark-lg" aria-hidden="true">CA</span>
            <h1 class="h4 mt-3 mb-1">College Knowledge Assistant</h1>
            <p class="text-secondary small mb-0">Ask questions about your college's official documents, with sources.</p>
        </div>

        <div class="alert alert-danger py-2" th:if="${param.error}" role="alert">
            Incorrect email or password, or the account is disabled.
        </div>
        <div class="alert alert-info py-2" th:if="${param.logout}" role="status">You have been signed out.</div>
        <div class="alert alert-success py-2" th:if="${param.registered}" role="status">
            Account created. You can sign in now.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Email</label>
                <input id="username" name="username" type="email" class="form-control" required autofocus
                       autocomplete="username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input id="password" name="password" type="password" class="form-control" required
                       autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>
        <p class="text-center small mt-4 mb-0">New student? <a th:href="@{/register}">Create an account</a></p>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
